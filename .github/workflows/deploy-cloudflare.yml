name: Deploy RPGJS game to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # env:
    #   CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    #   CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    #   RPGJS_PUBLISH_TARGET: https://rpgjs-cloudflare-mmorpg-production.gaoshan070.workers.dev
    #   RPGJS_MAP_UPDATE_TOKEN: ${{ secrets.RPGJS_MAP_UPDATE_TOKEN }}
    #   RPGJS_MAP_IDS: demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment secrets
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RPGJS_MAP_UPDATE_TOKEN: ${{ secrets.RPGJS_MAP_UPDATE_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$RPGJS_MAP_UPDATE_TOKEN" || { echo "Missing RPGJS_MAP_UPDATE_TOKEN repository secret"; exit 1; }

      - name: Test Cloudflare game
        run: pnpm --dir samples/cloudflare-mmorpg test

      - name: Build Cloudflare game
        run: pnpm --dir samples/cloudflare-mmorpg build

      - name: Deploy Worker and static assets
        run: pnpm --dir samples/cloudflare-mmorpg exec wrangler deploy --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Publish authoritative maps
        run: pnpm --dir samples/cloudflare-mmorpg publish:maps
        env:
          RPGJS_PUBLISH_TARGET: https://rpgjs-cloudflare-mmorpg-production.gaoshan070.workers.dev          
          RPGJS_MAP_UPDATE_TOKEN: ${{ secrets.RPGJS_MAP_UPDATE_TOKEN }}
          RPGJS_MAP_IDS: demo
